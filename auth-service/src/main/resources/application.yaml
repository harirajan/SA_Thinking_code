server:
  port: 8083

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://postgres-primary:5432/auth_db
    username: harirajana
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: false
    hostname: auth-service

jwt:
  secret: "change-this-to-a-real-256-bit-secret-before-anything-real-depends-on-it"
  expiration-ms: 3600000
#logging:
#  level:
#    org.springframework.security: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,mappings