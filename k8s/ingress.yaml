apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sa-thinking-code-ingress
  namespace: sa-thinking-code
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
